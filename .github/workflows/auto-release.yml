name: StockDone Automatic Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockdone-auto-release-main
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Preflight typecheck and Windows package build
        run: npm run desktop:win

      - name: Verify Windows installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "*Setup*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not produced by the preflight build."
          }
          Write-Host "Verified installer: $($installer.FullName)"
          "PREFLIGHT_INSTALLER=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bump patch version
        shell: pwsh
        run: |
          npm version patch --no-git-tag-version
          $version = node -p "require('./package.json').version"
          "VERSION=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VERSION_NUMBER=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Commit version
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release $env:VERSION_NUMBER [skip ci]"
          git push origin HEAD:main
          $commit = git rev-parse HEAD
          "RELEASE_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create release tag
        shell: pwsh
        run: |
          git tag -a "$env:VERSION" "$env:RELEASE_COMMIT" -m "StockDone $env:VERSION"
          git push origin "$env:VERSION"

      - name: Publish verified Windows installer
        run: npm run desktop:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub release and installer
        shell: pwsh
        run: |
          gh release view "$env:VERSION" --repo "${{ github.repository }}"
          $releaseInstaller = gh release view "$env:VERSION" --repo "${{ github.repository }}" --json assets --jq ".assets[].name | select(endswith('.exe'))"
          if (-not $releaseInstaller) {
            throw "GitHub release $env:VERSION has no Windows installer asset."
          }
          Write-Host "Verified published installer asset: $releaseInstaller"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
