name: StockDone Automatic Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockdone-auto-release-main
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump patch version
        shell: pwsh
        run: |
          npm version patch --no-git-tag-version
          $version = node -p "require('./package.json').version"
          "VERSION=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VERSION_NUMBER=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Commit version and tag release
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release $env:VERSION_NUMBER [skip ci]"
          git tag -a "$env:VERSION" -m "StockDone $env:VERSION"
          git push origin HEAD:main
          git push origin "$env:VERSION"

      - name: Verify Windows release
        shell: pwsh
        run: |
          $maxAttempts = 36
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            gh release view "$env:VERSION" --repo "${{ github.repository }}" 2>$null
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            Start-Sleep -Seconds 10
          }
          throw "GitHub release $env:VERSION was not published within the expected time."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
