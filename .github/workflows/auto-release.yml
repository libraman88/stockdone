name: StockDone Automatic Windows Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: stockdone-auto-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bump patch version
        shell: pwsh
        run: |
          npm version patch --no-git-tag-version
          $version = node -p "require('./package.json').version"
          "VERSION=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VERSION_NUMBER=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Commit version and tag release
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release $env:VERSION_NUMBER [skip ci]"
          git tag -a "$env:VERSION" -m "StockDone $env:VERSION"
          git push origin main
          git push origin "$env:VERSION"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and publish Windows installer
        run: npm run desktop:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub release
        shell: pwsh
        run: |
          gh release view "$env:VERSION" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
