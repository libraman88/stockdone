name: StockDone Automatic Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockdone-auto-release-main
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Preflight typecheck and Windows package build
        run: npm run desktop:win

      - name: Verify Windows installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "*Setup*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not produced by the preflight build."
          }
          Write-Host "Verified installer: $($installer.FullName)"
          "PREFLIGHT_INSTALLER=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bump patch version
        shell: pwsh
        run: |
          npm version patch --no-git-tag-version
          $version = node -p "require('./package.json').version"
          "VERSION=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VERSION_NUMBER=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Commit version
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release $env:VERSION_NUMBER [skip ci]"
          git push origin HEAD:main
          $commit = git rev-parse HEAD
          "RELEASE_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create release tag
        shell: pwsh
        run: |
          git tag -a "$env:VERSION" "$env:RELEASE_COMMIT" -m "StockDone $env:VERSION"
          git push origin "$env:VERSION"

      - name: Build verified Windows installer for release
        run: npm run desktop:win

      - name: Ensure Windows installer asset is published
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem -Path release -Filter "*Setup*.exe" -File |
            Where-Object { $_.Name -notlike "*.blockmap" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not produced by the publish build."
          }

          $expectedAsset = "StockDone-Setup-$env:VERSION_NUMBER.exe"
          $uploaded = $false
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            $assetNames = @(gh release view "$env:VERSION" --repo "$env:GITHUB_REPOSITORY" --json assets --template '{{range .assets}}{{println .name}}{{end}}')
            $published = $assetNames | Where-Object { $_ -eq $expectedAsset } | Select-Object -First 1
            if ($published) {
              Write-Host "Installer already published: $expectedAsset"
              $uploaded = $true
              break
            }

            Write-Host "Uploading installer attempt $attempt/6: $($installer.FullName)"
            gh release upload "$env:VERSION" "$($installer.FullName)" --repo "$env:GITHUB_REPOSITORY" --clobber
            Start-Sleep -Seconds 5
          }

          if (-not $uploaded) {
            $assetNames = @(gh release view "$env:VERSION" --repo "$env:GITHUB_REPOSITORY" --json assets --template '{{range .assets}}{{println .name}}{{end}}')
            if ($assetNames -notcontains $expectedAsset) {
              throw "Failed to publish Windows installer asset $expectedAsset."
            }
          }
      - name: Verify GitHub release and installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $maxAttempts = 12
          $delaySeconds = 10
          $verified = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Checking GitHub release assets (attempt $attempt/$maxAttempts)..."
            $assetNames = @(gh release view "$env:VERSION" --repo "$env:GITHUB_REPOSITORY" --json assets --template '{{range .assets}}{{println .name}}{{end}}')
            $releaseInstaller = $assetNames | Where-Object { $_ -match '.exe$' } | Select-Object -First 1

            if ($releaseInstaller) {
              Write-Host "Verified published installer asset: $releaseInstaller"
              $verified = $true
              break
            }

            if ($attempt -lt $maxAttempts) {
              Start-Sleep -Seconds $delaySeconds
            }
          }

          if (-not $verified) {
            throw "GitHub release $env:VERSION did not expose a Windows installer asset after waiting for publication."
          }
